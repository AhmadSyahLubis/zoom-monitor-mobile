name: zoom_monitor_mobile
description: "Aplikasi Mobile Enterprise Zoom Monitor untuk kebutuhan Online Meeting anda"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Reactive UI
  flutter_riverpod: ^2.5.1

  # HTTP Client & Network
  dio: ^5.4.3+1

  # Keamanan & Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Hardware Biometrics & Hardware Identification
  local_auth: ^2.2.0
  device_info_plus: ^10.1.0

  # Routing & Deep Linking
  go_router: ^14.1.4

  # Date, Time & Localization (WIB Asia/Jakarta)
  intl: ^0.19.0

  # UI Enhancement, Icons & Typography
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Actions, Clipboard & External Launchers
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  phosphor_icons: 3.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
